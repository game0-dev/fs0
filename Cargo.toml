[workspace]
members = [
    "crates/fs0-central",
    "crates/fs0-cli",
    "crates/fs0-client",
    "crates/fs0-core",
    "crates/fs0-fuse",
    "crates/fs0-storage",
    "crates/fs0-transport",
    "crates/fs0-volume",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/imxinlei/fs0"
version = "0.1.0"

[workspace.dependencies]
blake3 = "1.8.2"
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
fs0-central = { version = "0.1.0", path = "crates/fs0-central" }
fs0-core = { version = "0.1.0", path = "crates/fs0-core" }
fs0-storage = { version = "0.1.0", path = "crates/fs0-storage" }
fs0-transport = { version = "0.1.0", path = "crates/fs0-transport" }
fs0-volume = { version = "0.1.0", path = "crates/fs0-volume" }
iroh = "1.0.0-rc.0"
iroh-relay = "1.0.0-rc.0"
postcard = { version = "1.1.3", features = ["alloc"] }
rcgen = "0.14.8"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = "1.48.0"
toml = "0.9.8"
tracing = "0.1.43"
zstd = "0.13.3"
