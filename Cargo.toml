[workspace]
members = [
    "crates/fs0-central",
    "crates/fs0-cli",
    "crates/fs0-client",
    "crates/fs0-core",
    "crates/fs0-fuse",
    "crates/fs0-storage",
    "crates/fs0-transport",
    "crates/fs0-volume",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/imxinlei/fs0"
version = "0.1.0"

[workspace.dependencies]
blake3 = "1.8.2"
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
iroh = "1.0.0-rc.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = "1.48.0"
toml = "0.9.8"
tracing = "0.1.43"
zstd = "0.13.3"
