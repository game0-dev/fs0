name: Publish crates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    name: Publish fs0 client crates
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version tag when running on tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/check-version-tag.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Dry run fs0-core publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fs0-core --dry-run --locked

      - name: Publish fs0-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fs0-core --locked

      - name: Wait for fs0-core index
        run: sleep 30

      - name: Dry run fs0-config publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fs0-config --dry-run --locked

      - name: Publish fs0-config
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fs0-config --locked

      - name: Wait for fs0-config index
        run: sleep 30

      - name: Dry run fs0-transport publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fs0-transport --dry-run --locked

      - name: Publish fs0-transport
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fs0-transport --locked

      - name: Wait for fs0-transport index
        run: sleep 30

      - name: Dry run fs0-client publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fs0-client --dry-run --locked

      - name: Publish fs0-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p fs0-client --locked
